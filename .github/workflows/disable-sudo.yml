name: Disable sudo
on:
  workflow_dispatch:
jobs:
  priv-01-sudo-block:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (disable-sudo-and-containers)
        uses: prateek-stepsecurity/harden-runner@int
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - name: Attempt sudo (expect failure)
        run: |
          sudo whoami
      - name: Attempt sudo (expect failure)
        if: always()
        run: |
          curl https://google.com
          curl https://youtube.com
      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com
          